# Certifications. Academic lists all 13; casual lists none — MOOC certificates
# read as padding next to a peer-reviewed publication record, so the casual CV
# leaves them to the website. `make-certifications` self-suppresses on an empty
# list, so re-adding `casual` to any entry below brings the section back.
# `name_casual` overrides the name just for the casual CV when the phrasing
# differs (e.g. Oracle cert includes the score on casual).
# `url:` is the public verification URL (e.g. Coursera certificate page).
# `pdf_url:` is a local PDF link relative to the site root (used by the
# website to render a [Certificate] link alongside `url`).

