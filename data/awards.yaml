# Awards / Honours / Achievements.
# Academic renders these under "Honours & Awards" with a numbered enum and
# footnote markers ('*', '†', '‡'). Casual renders them under "Achievements"
# as a tight list with year and optional place.
#
# `marker`: optional footnote symbol (rendered as superscript, academic only)
# `organizer`: academic-only detail showing who ran the event
# `place_casual`: what the casual CV calls this entry (e.g. "1st place")
# `description_casual`: falls back to place_casual; renderer prefers this

awards_notes_academic:
  - marker: "*"
    text: "President of the IEEE Student Branch of UCSC"
  - marker: "†"
    text: "Finance Team Lead of IEEE TAP project"
  - marker: "‡"
    text: "Program Team Lead of CloudHack 17 hackathon"

