# Taglines displayed under the name.
# Casual CV renders `roles_casual` as a slash-separated mono run:
#   ML Engineer  /  Data Scientist
# Falls back to `tagline_casual` if `roles_casual` is absent.
#
# Kept short deliberately: the run renders on one line at body-size, and page
# 1's main column is a fixed-height block that clips rather than reflows. Three
# spelled-out titles wrap and slice the last stack-chip row off the page.
roles_casual:
  - "ML Engineer"
  - "Data Scientist"
tagline_casual: "Lead Machine Learning Engineer"
tagline_academic_role: "Researcher"
tagline_academic_field: "Computer Science"

# Contact details.
emails:
