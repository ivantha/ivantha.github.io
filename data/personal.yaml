  - address: osh@ucsc.cmb.ac.lk
    academic_only: true
phone: "(+94) 71 908 4020"
location: "Colombo, Sri Lanka"

homepage:
  url: "https://ivantha.com"
  label: "ivantha.com"

# All known profiles (keyed by slug). Each variant picks which to show via
